# Shared MOIMOB CI: https://github.com/MOIMOB/.github (toggles in README)
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        uses: MOIMOB/.github/.github/workflows/ci.yml@feat/reusable-ci
        with:
            fastlane-metadata: true
            format-check: false # TODO: add format:check script
            lint: false # ESLint 8 legacy, only lint-fix
            post-build: npx cap update && npx cap copy
            e2e: cypress
            e2e-wait-on: http://localhost:8080
