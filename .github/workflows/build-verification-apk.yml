name: Build Verification APK

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'zulu'
                  java-version: '21'

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Install dependencies
              run: npm ci

            - name: Build web assets
              run: npm run build:play-store

            - name: Capacitor update
              run: npx cap update

            - name: Decode keystore
              run: echo ${{ secrets.RELEASE_KEYSTORE }} | base64 -d > android/keystore.jks

            - name: List keystore aliases and fingerprints
              run: keytool -list -v -keystore android/keystore.jks -storepass ${{ secrets.RELEASE_KEYSTORE_PASSWORD }} | grep -E "Alias|SHA256"

            - name: Build release APK
              run: ./gradlew assembleRelease
              working-directory: android

            - name: Sign APK
              run: |
                  APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
                  $APKSIGNER sign \
                    --ks android/keystore.jks \
                    --ks-pass pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
                    --ks-key-alias key0 \
                    --out android/app/build/outputs/apk/release/app-release-signed.apk \
                    android/app/build/outputs/apk/release/app-release-unsigned.apk

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: verification-apk
                  path: android/app/build/outputs/apk/release/app-release-signed.apk
                  retention-days: 7
